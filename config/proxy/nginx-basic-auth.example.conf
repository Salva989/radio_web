server {
  listen 443 ssl http2;
  server_name dashboard.radio.example.com;

  ssl_certificate /etc/letsencrypt/live/dashboard.radio.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dashboard.radio.example.com/privkey.pem;

  auth_basic "Radio dashboard";
  auth_basic_user_file /etc/nginx/.htpasswd;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
